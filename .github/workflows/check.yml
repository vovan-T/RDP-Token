name: Source and gateway tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static source checks
        run: python3 scripts/check_source.py
      - name: Compose syntax
        run: docker compose --env-file .env.example config --quiet
      - name: Build test image
        run: docker build -t rdp-token-check .
      - name: Isolated gateway tests
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:size=32m \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/src \
            -v "$PWD:/src:ro" -w /src rdp-token-check sh scripts/test.sh
